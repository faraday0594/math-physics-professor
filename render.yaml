services:
  - type: web
    name: math-physics-ai-professor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_BASE_URL
        value: https://api.minimax.io/v1
      - key: MINIMAX_MODEL
        value: MiniMax-M3.1-Flash
